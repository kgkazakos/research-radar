name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install setuptools pytest ruff click rich
          pip install -e . --no-build-isolation

      - name: Lint (ruff)
        run: ruff check research_radar/ tests/ --exclude research_radar/llm.py

      - name: Run tests
        run: pytest tests/ -v
